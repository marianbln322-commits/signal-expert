services:
  signal-expert:
    build: .
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4100
      DATABASE_PATH: /app/data/signal-expert.db
      PUBLIC_DIRECTORY: /app/public
      MIGRATION_DIRECTORY: /app/migrations
      PRIMARY_MARKET_BASE_URL: https://data-api.binance.vision
      MARKET_FAILOVER_ENABLED: "true"
      FALLBACK_MARKET_BASE_URL: https://api.mexc.com
      PROVIDER_TIMEOUT_MS: 5000
      PROVIDER_ATTEMPTS: 2
      MARKET_SYMBOLS: BTCUSDT,ETHUSDT
      TICKER_POLL_MS: 3000
      CANDLE_POLL_MS: 5000
      STALE_AFTER_MS: 30000
      ENTRY_TRIGGER_GRACE_MS: ${ENTRY_TRIGGER_GRACE_MS:-90000}
      ENTRY_BTC_MAX_SPREAD_BPS: ${ENTRY_BTC_MAX_SPREAD_BPS:-2}
      ENTRY_ETH_MAX_SPREAD_BPS: ${ENTRY_ETH_MAX_SPREAD_BPS:-3}
      ENTRY_MIN_TOP_NOTIONAL_USDT: ${ENTRY_MIN_TOP_NOTIONAL_USDT:-100}
      ENTRY_MAX_SOURCE_SKEW_MS: ${ENTRY_MAX_SOURCE_SKEW_MS:-10000}
      EVENT_RISK_ENABLED: ${EVENT_RISK_ENABLED:-false}
      EVENT_RISK_BASE_URL: ${EVENT_RISK_BASE_URL:-https://api.tradingeconomics.com}
      EVENT_RISK_API_KEY: ${EVENT_RISK_API_KEY:-}
      EVENT_RISK_POLL_MS: ${EVENT_RISK_POLL_MS:-300000}
      EVENT_RISK_STALE_AFTER_MS: ${EVENT_RISK_STALE_AFTER_MS:-900000}
      EVENT_RISK_PRE_WINDOW_MS: ${EVENT_RISK_PRE_WINDOW_MS:-1800000}
      EVENT_RISK_POST_WINDOW_MS: ${EVENT_RISK_POST_WINDOW_MS:-900000}
      EVENT_RISK_MIN_IMPORTANCE: ${EVENT_RISK_MIN_IMPORTANCE:-3}
      PAPER_PAYOUT_RATE: ${PAPER_PAYOUT_RATE:-0.80}
      PAPER_INITIAL_BANKROLL: ${PAPER_INITIAL_BANKROLL:-500}
      PAPER_DAILY_LOSS_LIMIT: ${PAPER_DAILY_LOSS_LIMIT:-10}
      PAPER_MAX_OPEN_POSITIONS: ${PAPER_MAX_OPEN_POSITIONS:-2}
      PAPER_BTC_MAX_STAKE: ${PAPER_BTC_MAX_STAKE:-250}
      PAPER_ETH_MAX_STAKE: ${PAPER_ETH_MAX_STAKE:-150}
      AUTONOMOUS_ENABLED: ${AUTONOMOUS_ENABLED:-true}
      AUTONOMOUS_STAKE_PROFILE: ${AUTONOMOUS_STAKE_PROFILE:-adaptive}
      AUTONOMOUS_SCAN_MS: ${AUTONOMOUS_SCAN_MS:-5000}
      AUTONOMOUS_SYMBOLS: ${AUTONOMOUS_SYMBOLS:-BTCUSDT,ETHUSDT}
      AUTONOMOUS_HORIZONS: ${AUTONOMOUS_HORIZONS:-10,30}
      AUTONOMOUS_BASE_STAKE_FRACTION: ${AUTONOMOUS_BASE_STAKE_FRACTION:-0.005}
      AUTONOMOUS_MAX_STAKE_FRACTION: ${AUTONOMOUS_MAX_STAKE_FRACTION:-0.02}
      AUTONOMOUS_ABSOLUTE_STAKE_CAP: ${AUTONOMOUS_ABSOLUTE_STAKE_CAP:-25}
      AUTONOMOUS_DAILY_PROFIT_TARGET: ${AUTONOMOUS_DAILY_PROFIT_TARGET:-100}
      AUTONOMOUS_DAILY_LOSS_LIMIT: ${AUTONOMOUS_DAILY_LOSS_LIMIT:-10}
      AUTONOMOUS_SEGMENT_GATE_ENABLED: ${AUTONOMOUS_SEGMENT_GATE_ENABLED:-true}
      AUTONOMOUS_SEGMENT_MIN_SAMPLE: ${AUTONOMOUS_SEGMENT_MIN_SAMPLE:-20}
      AUTONOMOUS_STANDARD_THRESHOLD: ${AUTONOMOUS_STANDARD_THRESHOLD:-68}
      AUTONOMOUS_HIGH_THRESHOLD: ${AUTONOMOUS_HIGH_THRESHOLD:-78}
      AUTONOMOUS_EXCEPTIONAL_THRESHOLD: ${AUTONOMOUS_EXCEPTIONAL_THRESHOLD:-88}
      AUTONOMOUS_OBSERVED_LADDER: ${AUTONOMOUS_OBSERVED_LADDER:-10,30,90,270}
      MANUAL_SIGNALS_ENABLED: ${MANUAL_SIGNALS_ENABLED:-true}
      MANUAL_SIGNAL_SCAN_MS: ${MANUAL_SIGNAL_SCAN_MS:-3000}
      MANUAL_SIGNAL_ENTRY_WINDOW_MS: ${MANUAL_SIGNAL_ENTRY_WINDOW_MS:-30000}
      MANUAL_SIGNAL_MAX_RESOLUTION_LAG_MS: ${MANUAL_SIGNAL_MAX_RESOLUTION_LAG_MS:-30000}
      MANUAL_SIGNAL_MIN_DECISIVE_SAMPLE: ${MANUAL_SIGNAL_MIN_DECISIVE_SAMPLE:-20}
      MANUAL_SIGNAL_CONFIDENCE_GATE_ENABLED: ${MANUAL_SIGNAL_CONFIDENCE_GATE_ENABLED:-true}
      TRADING_MODE: paper
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - signal_expert_data:/app/data
    restart: unless-stopped
volumes:
  signal_expert_data:
